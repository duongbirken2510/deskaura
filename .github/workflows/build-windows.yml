name: Build Windows & Linux Releases

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Release_Windows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Windows NSIS Installer & Portable Binary
        run: npx tauri build --bundles nsis

      - name: Update Release_Windows, push to main, and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content -Raw -Path "package.json" | ConvertFrom-Json
          $version = $pkg.version
          $tag = "v$version"
          Write-Host "Packaging DeskAura Windows $tag..."

          if (!(Test-Path "Release_Windows")) {
            New-Item -ItemType Directory -Force -Path "Release_Windows" | Out-Null
          }

          # Remove older setup installers so only the latest version remains
          Get-ChildItem -Path "Release_Windows" -Filter "DeskAura_*_x64-setup.exe" | Remove-Item -Force -ErrorAction SilentlyContinue

          $nsisInstaller = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*_x64-setup.exe" | Select-Object -First 1
          if ($null -ne $nsisInstaller) {
            Copy-Item -Path $nsisInstaller.FullName -Destination "Release_Windows/DeskAura_${version}_x64-setup.exe" -Force
          }

          if (Test-Path "src-tauri/target/release/deskaura.exe") {
            Copy-Item -Path "src-tauri/target/release/deskaura.exe" -Destination "Release_Windows/DeskAura_Portable.exe" -Force
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Release_Windows/
          $status = git status --porcelain Release_Windows/
          if ($status) {
            git commit -m "chore(release): auto-build Windows v$version installer and portable exe [skip ci]"
            git pull --rebase origin main
            git push origin main
          } else {
            Write-Host "No changes in Release_Windows to commit."
          }

          # Publish or update official GitHub Release for $tag with Windows, macOS & Demo Video assets
          $assets = @()
          if (Test-Path "Release_Windows/DeskAura_${version}_x64-setup.exe") {
            $assets += "Release_Windows/DeskAura_${version}_x64-setup.exe"
          }
          if (Test-Path "Release_Windows/DeskAura_Portable.exe") {
            $assets += "Release_Windows/DeskAura_Portable.exe"
          }
          $macDmgs = Get-ChildItem -Path "Release_macOS" -Filter "*.dmg" -ErrorAction SilentlyContinue
          foreach ($dmg in $macDmgs) {
            $assets += $dmg.FullName
          }
          if (Test-Path "docs/media/deskaura_demo_45s.mp4") {
            $assets += "docs/media/deskaura_demo_45s.mp4"
          }

          $releaseTitle = "DeskAura $tag — Silent OTA, Hardware Encryption & Bilingual Edition (VI/EN)"
          $notesArgs = @()
          if (Test-Path "RELEASE_NOTES.md") {
            $notesArgs = @("--notes-file", "RELEASE_NOTES.md")
          } else {
            $notesArgs = @("--notes", "DeskAura $tag Official Release (macOS Apple Silicon .dmg + Windows x64 Setup & Portable .exe)")
          }

          $releaseExists = $false
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          }

          if ($releaseExists) {
            Write-Host "Updating existing GitHub Release $tag..."
            gh release edit $tag --title $releaseTitle @notesArgs
            if ($assets.Count -gt 0) {
              gh release upload $tag @assets --clobber
            }
          } else {
            Write-Host "Creating new GitHub Release $tag..."
            if ($assets.Count -gt 0) {
              gh release create $tag @assets --title $releaseTitle @notesArgs --target main
            } else {
              gh release create $tag --title $releaseTitle @notesArgs --target main
            }
          }

  build-linux:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Linux .deb & .AppImage Bundles
        run: npx tauri build --bundles deb,appimage

      - name: Publish Linux .deb and .AppImage to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Packaging DeskAura Linux ${TAG} (.deb & .AppImage)..."

          mkdir -p dist_linux
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          APPIMAGE_FILE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1)

          ASSETS=()
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" "dist_linux/DeskAura_${VERSION}_amd64.deb"
            ASSETS+=("dist_linux/DeskAura_${VERSION}_amd64.deb")
          fi
          if [ -n "$APPIMAGE_FILE" ] && [ -f "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "dist_linux/DeskAura_${VERSION}_amd64.AppImage"
            chmod +x "dist_linux/DeskAura_${VERSION}_amd64.AppImage"
            ASSETS+=("dist_linux/DeskAura_${VERSION}_amd64.AppImage")
          fi

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No Linux artifacts found to upload."
            exit 1
          fi

          RELEASE_TITLE="DeskAura ${TAG} — Silent OTA, Hardware Encryption & Bilingual Edition (VI/EN)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Uploading Linux artifacts to existing GitHub Release ${TAG}..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating GitHub Release ${TAG} with Linux artifacts..."
            if [ -f "RELEASE_NOTES.md" ]; then
              gh release create "$TAG" "${ASSETS[@]}" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES.md --target main
            else
              gh release create "$TAG" "${ASSETS[@]}" --title "$RELEASE_TITLE" --notes "DeskAura ${TAG} Official Release (macOS .dmg, Windows .exe, Linux .deb & .AppImage)" --target main
            fi
          fi


