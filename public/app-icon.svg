<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="50%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="64" y1="36" x2="192" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="100" y1="100" x2="176" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="20" y="20" width="216" height="224" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0EA5E9" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="12" y="12" width="232" height="232" rx="60" fill="url(#bgGrad)" stroke="#BAE6FD" stroke-width="4"/>
  
  <!-- Water Drop Shape -->
  <g filter="url(#softShadow)">
    <path d="M128 40C128 40 68 112 68 156C68 189.137 94.8629 216 128 216C161.137 216 188 189.137 188 156C188 112 128 40 128 40Z" fill="url(#dropGrad)"/>
  </g>

  <!-- Gloss Highlight on Drop -->
  <path d="M92 146C92 124 112 88 118 78" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.65"/>

  <!-- Fresh Sprout Leaf Inside/Embracing Drop -->
  <path d="M128 204V142" stroke="#ECFDF5" stroke-width="7" stroke-linecap="round"/>
  <path d="M128 158C128 130 156 112 178 116C178 144 156 164 128 158Z" fill="url(#leafGrad)" stroke="#ECFDF5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M128 170C128 148 106 134 88 138C88 160 106 174 128 170Z" fill="#6EE7B7" stroke="#ECFDF5" stroke-width="4" stroke-linejoin="round"/>
</svg>

