<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1260" width="2400" height="1260">
  <defs>
    <!-- Calm-Tech Studio Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="48%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- Soft Radial Aura Glows -->
    <radialGradient id="emeraldAura" cx="28%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#14B8A6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="skyAura" cx="78%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <!-- App Icon Squircle Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.65" />
    </linearGradient>

    <!-- Water Droplet Gradient -->
    <linearGradient id="dropletGrad" x1="20%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Emerald Sprout Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Wordmark "Aura" Gradient -->
    <linearGradient id="auraTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#0F172A" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.08" />
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#064E3B" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0EA5E9" flood-opacity="0.18" />
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.8" fill="#94A3B8" fill-opacity="0.22" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="2400" height="1260" fill="url(#bgGrad)" />
  <rect width="2400" height="1260" fill="url(#emeraldAura)" />
  <rect width="2400" height="1260" fill="url(#skyAura)" />
  <rect width="2400" height="1260" fill="url(#dotGrid)" />

  <!-- Decorative Ambient Soundwave & Ring Curves in Background -->
  <g opacity="0.22" fill="none" stroke="url(#auraTextGrad)" stroke-width="2.5">
    <circle cx="560" cy="630" r="370" stroke-dasharray="8 14" />
    <circle cx="560" cy="630" r="430" stroke-opacity="0.5" />
  </g>

  <!-- Main Glassmorphic Presentation Card -->
  <rect
    x="140"
    y="150"
    width="2120"
    height="960"
    rx="72"
    fill="#FFFFFF"
    fill-opacity="0.86"
    stroke="#E2E8F0"
    stroke-width="3"
    filter="url(#cardShadow)"
  />

  <!-- Top Right Version & Platform Pill -->
  <g transform="translate(1720, 220)">
    <rect x="0" y="0" width="460" height="60" rx="30" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2.5" />
    <circle cx="38" cy="30" r="8" fill="#10B981" />
    <text
      x="62"
      y="38"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif"
      font-size="22"
      font-weight="800"
      fill="#065F46"
      letter-spacing="0.3"
    >
      macOS &amp; Windows • Calm Tech
    </text>
  </g>

  <!-- LEFT: 3D Tactile App Icon Squircle (520x520) -->
  <g transform="translate(270, 370)">
    <rect
      x="0"
      y="0"
      width="520"
      height="520"
      rx="124"
      fill="url(#squircleBg)"
      stroke="url(#squircleBorder)"
      stroke-width="5"
      filter="url(#iconShadow)"
    />

    <!-- Inner Activity Progress Ring -->
    <circle
      cx="260"
      cy="260"
      r="204"
      fill="none"
      stroke="#1E293B"
      stroke-width="14"
      opacity="0.55"
    />
    <circle
      cx="260"
      cy="260"
      r="204"
      fill="none"
      stroke="url(#squircleBorder)"
      stroke-width="14"
      stroke-dasharray="980 1282"
      stroke-linecap="round"
      transform="rotate(-90 260 260)"
    />

    <!-- Luminous Water Droplet Silhouette -->
    <path
      d="M260 96
         C260 96, 384 236, 384 322
         C384 391, 328 446, 260 446
         C192 446, 136 391, 136 322
         C136 236, 260 96, 260 96 Z"
      fill="url(#dropletGrad)"
    />

    <!-- Rising Liquid Wave Highlight Inside Droplet -->
    <path
      d="M144 304
         Q202 284, 260 304
         T376 304
         C382 378, 328 442, 260 442
         C192 442, 138 378, 144 304 Z"
      fill="#0369A1"
      opacity="0.38"
    />

    <!-- 3D Glossy Specular Reflection on Left Curve of Droplet -->
    <path
      d="M178 275 C166 315, 178 368, 210 395"
      fill="none"
      stroke="#E0F2FE"
      stroke-width="14"
      stroke-linecap="round"
      opacity="0.72"
    />

    <!-- Vibrant Emerald Sprout Leaves Growing from Heart of Droplet -->
    <g transform="translate(260, 295)">
      <!-- Stem -->
      <path
        d="M0 78 Q-3 20, 0 -38"
        fill="none"
        stroke="#ECFDF5"
        stroke-width="12"
        stroke-linecap="round"
      />
      <!-- Left Lush Leaf -->
      <path
        d="M0 12 C-68 6, -92 -46, -42 -68 C-6 -56, 0 -16, 0 12 Z"
        fill="url(#leafGrad)"
        stroke="#ECFDF5"
        stroke-width="4"
      />
      <!-- Right Lush Leaf -->
      <path
        d="M0 -4 C68 -10, 92 -62, 42 -84 C6 -72, 0 -32, 0 -4 Z"
        fill="#34D399"
        stroke="#ECFDF5"
        stroke-width="4"
      />
      <!-- Top Golden Dewbud -->
      <circle cx="0" cy="-58" r="11" fill="#FDE047" />
    </g>
  </g>

  <!-- RIGHT: Brand Typography & Value Pillars -->
  <g transform="translate(880, 445)">
    <!-- Eyebrow Tag -->
    <text
      x="4"
      y="0"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif"
      font-size="26"
      font-weight="800"
      fill="#059669"
      letter-spacing="4.5"
    >
      SMART OFFICE WELLNESS COMPANION
    </text>

    <!-- Main Brand Wordmark: DeskAura -->
    <text
      x="0"
      y="148"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif"
      font-size="168"
      font-weight="900"
      letter-spacing="-4"
    >
      <tspan fill="#0F172A">Desk</tspan><tspan fill="url(#auraTextGrad)">Aura</tspan>
    </text>

    <!-- Bilingual Subtitle / Tagline -->
    <text
      x="6"
      y="222"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif"
      font-size="36"
      font-weight="600"
      fill="#475569"
    >
      Trợ Lý Sức Khỏe, Nhắc Uống Nước &amp; Nhạc Nền Tập Trung Văn Phòng
    </text>

    <!-- 4 Feature Badges Row (2x2 or Wide Balanced Row) -->
    <g transform="translate(4, 282)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="300" height="66" rx="22" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2.5" />
        <text x="150" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0369A1">
          💧 Uống Nước &amp; 20-20-20
        </text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(316, 0)">
        <rect x="0" y="0" width="286" height="66" rx="22" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2.5" />
        <text x="143" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#047857">
          🧘 Giãn Cơ Cổ Vai Gáy
        </text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(618, 0)">
        <rect x="0" y="0" width="320" height="66" rx="22" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2.5" />
        <text x="160" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#B45309">
          🌱 Cây Xanh Ảo Bàn Làm Việc
        </text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(954, 0)">
        <rect x="0" y="0" width="336" height="66" rx="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2.5" />
        <text x="168" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#334155">
          🎧 Nhạc Nền &amp; Đồng Bộ Đa Máy
        </text>
      </g>
    </g>

    <!-- Author / Website Footer Line -->
    <text
      x="8"
      y="428"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif"
      font-size="24"
      font-weight="700"
      fill="#64748B"
    >
      Designed by Duong Birken • duongbirken.deta.vn • github.com/duongbirken2510/deskaura
    </text>
  </g>
</svg>
